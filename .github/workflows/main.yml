
name: Budowanie Moja Forma APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          unzip -o Moja_Forma_projekt_Android.zip -d projekt
          cp -r projekt/MojaFormaAndroid/. .

      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        run: gradle assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: moja-forma-apk
          path: app/build/outputs/apk/debug/app-debug.apk
