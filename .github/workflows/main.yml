
name: Budowanie Moja Forma APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Ustaw Jave
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rozpakuj nowy projekt
        run: |
         unzip -o Moja_Forma_3.1_FITNESS_PRO_PREMIUM.zip -d projekt
          cp -r projekt/MojaFormaAndroid/. .
          PROJECT_DIR="projekt/MojaFormaAndroid"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Nie znaleziono settings.gradle!"
            find projekt -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Zbuduj APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: moja-forma-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
          
